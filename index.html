<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Verdant Wilds — 2.5D HD-2D Octopath Diorama RPG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="w-screen h-screen flex items-center justify-center bg-slate-950 select-none overflow-hidden">
<div id="game-wrapper" class="relative w-full h-full overflow-hidden bg-slate-950">
      <canvas id="gameCanvas" width="800" height="450" class="w-full h-full block cursor-pointer"></canvas>
      <div id="diorama-lens" class="tilt-shift-lens"></div>

      <div id="hud-layer" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-2 sm:p-4 z-20">
        <!-- TOP ROW -->
        <div class="flex justify-between items-start w-full gap-2">
          <div class="flex flex-col gap-1 pointer-events-auto hud-compact-landscape origin-top-left">
            <div class="hud-glass rounded-xl px-2.5 py-1.5 flex items-center gap-2 text-[10px] sm:text-xs text-slate-200 shadow-lg">
              <span id="hud-hp-label" class="font-extrabold text-emerald-300 whitespace-nowrap">❤️ 100/100</span>
              <div class="w-16 sm:w-24 h-2 bg-slate-900 rounded-full overflow-hidden border border-white/15">
                <div id="hud-hp-bar" class="h-full bg-emerald-400 transition-all duration-200" style="width: 100%"></div>
              </div>
              <span id="hud-companion-badge" class="text-[9px] sm:text-[10px] px-1.5 py-0.5 rounded bg-amber-500/20 border border-amber-400/40 text-amber-300 font-bold hidden">🐾 -</span>
            </div>

            <div class="hud-glass rounded-lg px-2 py-1 flex items-center gap-1 text-[10px] text-slate-200 flex-wrap">
              <button id="area-badge-btn" onclick="toggleDebugOverlay()" class="hide-on-landscape px-1.5 py-0.5 rounded bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-400/40 text-emerald-200 font-bold transition" title="Debug Grid">
                🧭 <span id="coord-label">X:790 Y:460</span>
              </button>
              <button id="cam-mode-btn" onclick="cycleCameraMode()" class="px-1.5 py-0.5 rounded bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/40 text-amber-200 font-bold transition">
                Ikuti
              </button>
              <button onclick="adjustZoom(-0.2)" class="w-5 h-5 rounded bg-white/10 hover:bg-white/20 flex items-center justify-center font-bold text-white" title="Zoom Out">−</button>
              <span id="zoom-label" class="font-mono text-[9px] text-amber-300 min-w-[26px] text-center">1.0x</span>
              <button onclick="adjustZoom(0.2)" class="w-5 h-5 rounded bg-white/10 hover:bg-white/20 flex items-center justify-center font-bold text-white" title="Zoom In">+</button>
            </div>
          </div>

          <div class="relative pointer-events-auto group cursor-pointer shrink-0 hud-compact-landscape origin-top-right" onclick="openModal('map')" title="Buka Peta Dunia">
            <div class="minimap-frame w-20 h-20 sm:w-28 sm:h-28 rounded-full overflow-hidden relative">
              <canvas id="minimapCanvas" width="128" height="128" class="w-full h-full block"></canvas>
              <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-transparent via-white/5 to-white/20 pointer-events-none"></div>
            </div>
            <div class="absolute -top-1.5 left-1/2 -translate-x-1/2 bg-slate-950/90 text-amber-100 text-[9px] font-extrabold px-1.5 py-0.2 rounded-full border border-amber-300/40 shadow">
              N
            </div>
            <div class="sun-badge absolute -top-1 -right-1 w-6 h-6 sm:w-7 sm:h-7 flex items-center justify-center">
              <svg viewBox="0 0 32 32" class="w-full h-full">
                <circle cx="16" cy="16" r="7" fill="#fbbf24" stroke="#fef08a" stroke-width="1.5"></circle>
                <g stroke="#fbbf24" stroke-width="2" stroke-linecap="round">
                  <line x1="16" y1="2" x2="16" y2="6"></line><line x1="16" y1="26" x2="16" y2="30"></line>
                  <line x1="2" y1="16" x2="6" y2="16"></line><line x1="26" y1="16" x2="30" y2="16"></line>
                  <line x1="6.1" y1="6.1" x2="8.9" y2="8.9"></line><line x1="23.1" y1="23.1" x2="25.9" y2="25.9"></line>
                  <line x1="25.9" y1="6.1" x2="23.1" y2="8.9"></line><line x1="8.9" y1="23.1" x2="6.1" y2="25.9"></line>
                </g>
              </svg>
            </div>
          </div>
        </div>

        <!-- CENTER NOTIFICATIONS -->
        <div class="flex flex-col items-center justify-center pointer-events-none gap-1.5 my-auto">
          <div id="area-banner" class="hidden px-5 py-1.5 rounded-full bg-slate-950/85 border border-amber-300/50 text-amber-100 text-xs sm:text-sm font-extrabold tracking-wide shadow-2xl">
            🌿 LEMBAH UTAMA VERDANT WILDS
          </div>
          <div id="toast-banner" class="hidden px-3.5 py-1 rounded-full bg-slate-950/90 border border-amber-400/50 text-amber-200 text-[11px] font-semibold shadow-xl"></div>
          <div id="interact-prompt" onclick="triggerContextAction()" class="hidden pointer-events-auto cursor-pointer px-3.5 py-1.5 rounded-full bg-amber-500/95 hover:bg-amber-400 text-slate-950 font-extrabold text-[11px] sm:text-xs shadow-lg flex items-center gap-1.5 animate-bounce">
            <span>🖐️</span> <span id="interact-label">Interaksi [E / Tap]</span>
          </div>
        </div>

        <!-- BOTTOM ROW -->
        <div class="flex justify-between items-end w-full">
          <div id="dpad-container" class="pointer-events-auto relative w-24 h-24 sm:w-32 sm:h-32 rounded-full dpad-ring flex items-center justify-center select-none hud-compact-landscape origin-bottom-left">
            <svg viewBox="0 0 100 100" class="w-full h-full opacity-55 pointer-events-none">
              <polygon points="50,10 43,22 57,22" fill="#e2e8f0"></polygon>
              <polygon points="50,90 43,78 57,78" fill="#e2e8f0"></polygon>
              <polygon points="10,50 22,43 22,57" fill="#e2e8f0"></polygon>
              <polygon points="90,50 78,43 78,57" fill="#e2e8f0"></polygon>
            </svg>
            <div id="dpad-knob" class="w-10 h-10 sm:w-12 sm:h-12 rounded-full dpad-stick absolute pointer-events-none"></div>
          </div>

          <div id="dialog-box" class="hidden pointer-events-auto max-w-md w-full mx-2 hud-glass rounded-2xl p-3 sm:p-4 text-white border border-amber-300/40 shadow-2xl modal-pop">
            <div class="flex items-center justify-between mb-1">
              <span id="dialog-speaker" class="text-xs font-extrabold uppercase tracking-wider text-amber-300">NPC</span>
              <span class="text-[10px] text-slate-400">Spasi / Tap</span>
            </div>
            <p id="dialog-text" class="text-xs sm:text-sm text-slate-100 leading-relaxed mb-2.5"></p>
            <div id="dialog-actions" class="flex justify-end gap-2"></div>
          </div>

          <div class="pointer-events-auto flex flex-col items-end gap-1.5 hud-compact-landscape origin-bottom-right">
            <div class="flex items-center gap-1.5">
              <button id="lure-action-btn" onclick="useHabitatLure()" class="px-2.5 py-1 rounded-full bg-emerald-600/90 hover:bg-emerald-500 border border-emerald-200/70 text-white font-extrabold text-[10px] sm:text-xs shadow-lg flex items-center gap-1 active:scale-90 transition" title="Gunakan Umpan Habitat [R]">
                <span>📡</span> <span id="lure-btn-label">Umpan [R]</span>
              </button>
              <button onclick="triggerAryaAttack()" class="px-2.5 py-1 rounded-full bg-sky-600/90 hover:bg-sky-500 border border-sky-200/60 text-white font-extrabold text-[10px] sm:text-xs shadow-lg flex items-center gap-1 active:scale-90 transition" title="Serangan Energi [F]">
                <span>⚔️</span> <span>Serang</span>
              </button>
              <button onclick="triggerAryaSkill()" class="px-2.5 py-1 rounded-full bg-amber-500/95 hover:bg-amber-400 border border-amber-200/70 text-slate-950 font-extrabold text-[10px] sm:text-xs shadow-lg flex items-center gap-1 active:scale-90 transition" title="Skill Summon [Q]">
                <span>✨</span> <span>Skill</span>
              </button>
            </div>

            <div class="flex items-center gap-2 sm:gap-3">
              <!-- TOMBOL BULAT KECIL MISI DI BAWAH -->
              <button onclick="openModal('quest')" class="flex flex-col items-center group relative">
                <div class="action-orb w-10 h-10 sm:w-13 sm:h-13 rounded-full flex items-center justify-center relative">
                  <span class="text-base sm:text-lg font-extrabold text-amber-300">!</span>
                  <span id="quest-notif-dot" class="absolute -top-0.5 -right-0.5 w-3 h-3 rounded-full bg-amber-400 border border-slate-950 animate-ping"></span>
                </div>
                <span class="orb-label text-[10px] sm:text-xs font-bold text-slate-100 mt-0.5 drop-shadow">Misi</span>
              </button>

              <!-- Bag -->
              <button onclick="openModal('bag')" class="flex flex-col items-center group">
                <div class="action-orb w-10 h-10 sm:w-13 sm:h-13 rounded-full flex items-center justify-center">
                  <svg viewBox="0 0 32 32" class="w-5 h-5 sm:w-6 sm:h-6">
                    <path d="M11 9V7a5 5 0 0 1 10 0v2" fill="none" stroke="#f8fafc" stroke-width="2.2"></path>
                    <rect x="6" y="9" width="20" height="18" rx="4" fill="#cbd5e1" stroke="#1e293b" stroke-width="2"></rect>
                    <rect x="9" y="14" width="14" height="5" rx="1.5" fill="#94a3b8" stroke="#1e293b" stroke-width="1.5"></rect>
                    <rect x="14.5" y="15" width="3" height="4" rx="1" fill="#f8fafc"></rect>
                  </svg>
                </div>
                <span class="orb-label text-[10px] sm:text-xs font-bold text-slate-100 mt-0.5 drop-shadow">Bag</span>
              </button>

              <!-- Monstradex -->
              <button onclick="openModal('monstra')" class="flex flex-col items-center group">
                <div class="action-orb w-10 h-10 sm:w-13 sm:h-13 rounded-full flex items-center justify-center relative">
                  <svg viewBox="0 0 32 32" class="w-5 h-5 sm:w-6 sm:h-6">
                    <circle cx="16" cy="16" r="11" fill="#f8fafc" stroke="#1e293b" stroke-width="2.2"></circle>
                    <path d="M5 16a11 11 0 0 1 22 0Z" fill="#ef4444" stroke="#1e293b" stroke-width="2.2"></path>
                    <line x1="5" y1="16" x2="27" y2="16" stroke="#1e293b" stroke-width="2.5"></line>
                    <circle cx="16" cy="16" r="3.6" fill="#f8fafc" stroke="#1e293b" stroke-width="2.2"></circle>
                  </svg>
                  <span id="monstra-badge" class="absolute -top-1 -right-1 bg-amber-400 text-slate-950 font-extrabold text-[9px] w-4 h-4 rounded-full flex items-center justify-center border border-slate-900">0</span>
                </div>
                <span class="orb-label text-[10px] sm:text-xs font-bold text-slate-100 mt-0.5 drop-shadow">Monstra</span>
              </button>

              <!-- Map -->
              <button onclick="openModal('map')" class="flex flex-col items-center group">
                <div class="action-orb w-10 h-10 sm:w-13 sm:h-13 rounded-full flex items-center justify-center">
                  <svg viewBox="0 0 32 32" class="w-5 h-5 sm:w-6 sm:h-6">
                    <polygon points="4,8 12,5 20,8 28,5 28,24 20,27 12,24 4,27" fill="#fef3c7" stroke="#1e293b" stroke-width="2" stroke-linejoin="round"></polygon>
                    <line x1="12" y1="5" x2="12" y2="24" stroke="#92400e" stroke-width="1.8"></line>
                    <line x1="20" y1="8" x2="20" y2="27" stroke="#92400e" stroke-width="1.8"></line>
                  </svg>
                </div>
                <span class="orb-label text-[10px] sm:text-xs font-bold text-slate-100 mt-0.5 drop-shadow">Map</span>
              </button>

              <!-- Menu -->
              <button onclick="openModal('menu')" class="flex flex-col items-center group">
                <div class="action-orb w-10 h-10 sm:w-13 sm:h-13 rounded-full flex items-center justify-center">
                  <svg viewBox="0 0 32 32" class="w-5 h-5 sm:w-6 sm:h-6">
                    <circle cx="16" cy="16" r="4.2" fill="none" stroke="#f8fafc" stroke-width="2.4"></circle>
                    <path d="M16 4v3M16 25v3M4 16h3M25 16h3M7.5 7.5l2.1 2.1M22.4 22.4l2.1 2.1M24.5 7.5l-2.1 2.1M9.6 22.4l-2.1 2.1" stroke="#f8fafc" stroke-width="2.6" stroke-linecap="round"></path>
                  </svg>
                </div>
                <span class="orb-label text-[10px] sm:text-xs font-bold text-slate-100 mt-0.5 drop-shadow">Menu</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- BATTLE OVERLAY -->
    <div id="battle-overlay" class="hidden fixed inset-0 z-40 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-2 sm:p-4">
      <div class="w-full max-w-2xl hud-glass rounded-3xl border border-amber-300/40 overflow-hidden shadow-2xl flex flex-col modal-pop">
        <div class="flex items-center justify-between px-3 py-1.5 bg-slate-900/90 border-b border-white/10">
          <div class="flex items-center gap-2">
            <span class="text-xs sm:text-sm font-extrabold uppercase tracking-wider text-amber-300">⚔️ Wild Monstra Encounter</span>
            <span id="battle-rarity-badge" class="px-2 py-0.5 rounded-full text-[10px] font-extrabold bg-emerald-500/20 text-emerald-300 border border-emerald-400/40">COMMON</span>
          </div>
          <span id="battle-habitat-label" class="text-[10px] sm:text-xs text-slate-400 font-semibold">Habitat</span>
        </div>

        <div class="relative w-full bg-slate-950 flex items-center justify-center overflow-hidden">
          <canvas id="battle-arena-canvas" width="560" height="260"></canvas>
        </div>

        <div class="p-2.5 sm:p-4 bg-slate-950/95 border-t border-white/10 flex flex-col gap-2">
          <div id="battle-log-text" class="text-xs sm:text-sm text-amber-100 font-semibold min-h-[20px]">
            Seekor Monstra liar menghadang! Lemahkan HP-nya lalu gunakan Skill: Tame!
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-1.5 sm:gap-2">
            <button id="btn-battle-attack" onclick="executeBattleAttack()" class="py-2 px-2.5 rounded-xl bg-sky-600/90 hover:bg-sky-500 border border-sky-300/50 text-white font-extrabold text-xs shadow flex items-center justify-center gap-1.5 active:scale-95 transition">
              <span>⚔️</span> <span>Serang</span>
            </button>
            <button id="btn-battle-tame" onclick="executeBattleTame()" class="py-2 px-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 border border-amber-200 text-slate-950 font-extrabold text-xs shadow flex items-center justify-center gap-1.5 active:scale-95 transition">
              <span>✨</span> <span id="btn-tame-label">Skill: Tame</span>
            </button>
            <button id="btn-battle-berry" onclick="executeBattleBerry()" class="py-2 px-2.5 rounded-xl bg-emerald-600/85 hover:bg-emerald-500 border border-emerald-300/50 text-white font-extrabold text-xs shadow flex items-center justify-center gap-1.5 active:scale-95 transition">
              <span>🍓</span> <span id="btn-berry-label">Berry</span>
            </button>
            <button id="btn-battle-run" onclick="executeBattleRun()" class="py-2 px-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-white/15 text-slate-200 font-bold text-xs flex items-center justify-center gap-1.5 active:scale-95 transition">
              <span>🏃</span> <span>Kabur</span>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL OVERLAY -->
    <div id="modal-overlay" class="hidden fixed inset-0 z-30 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4">
      <div class="hud-glass rounded-2xl max-w-lg w-full p-5 text-slate-100 border border-white/20 modal-pop shadow-2xl max-h-[88dvh] flex flex-col">
        <div class="flex items-center justify-between pb-3 border-b border-white/10 shrink-0">
          <h3 id="modal-title" class="text-base sm:text-lg font-extrabold text-amber-300 tracking-wide">Menu</h3>
          <button onclick="closeModal()" class="w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 flex items-center justify-center text-slate-200 font-bold">✕</button>
        </div>
        <div id="modal-body" class="py-4 text-xs sm:text-sm space-y-3 overflow-y-auto flex-1"></div>
      </div>
    </div>
  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/collision.js"></script>
  <script src="js/map-terrain.js"></script>
  <script src="js/player-npc.js"></script>
  <script src="js/monsters.js"></script>
  <script src="js/habitat-spawner.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/areas.js"></script>
  <script src="js/ui-controls.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
